name: repo-radar-learn

# Monthly pass over Saved/Dismissed on the dashboard (Neon). Staggered two
# hours after the monthly all-lane radar run so a same-day install session
# has already refreshed docs/data/index.json, which dismissed-repo metadata
# is recovered from. See scripts/learn-from-feedback.mjs for what this does
# and does not auto-apply.
on:
  schedule:
    - cron: "0 15 1 * *"
  workflow_dispatch: {}

jobs:
  learn:
    name: Learn from Saved/Dismissed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Check for DATABASE_URL
        id: gate
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "DATABASE_URL is not set as a repo secret yet -- nothing to learn from until it is. Skipping without failing the run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: "22"

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: npm install

      - name: Learn from feedback
        if: steps.gate.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/learn-from-feedback.mjs

      - name: Commit results
        if: steps.gate.outputs.ready == 'true'
        run: |
          git config user.name  "repo-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add config/lanes.json docs/learned-adjustments.md
          git diff --cached --quiet || git commit -m "learn: $(date -u +%Y-%m-%d) from Saved/Dismissed"
          git push
